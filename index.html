<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cool Page - Vikum</title>
  <link href="styles.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #00ffc8, #00bfa6);
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 40px;
    }

    p {
      font-size: 1.1rem;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin: 8px auto;
      padding: 10px;
      width: 200px;
      border-radius: 8px;
      font-weight: bold;
    }

    img {
      border-radius: 50%;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: black;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      transition: 0.3s;
    }

    a:hover {
      background: #333;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>SHreksUrDad</h1>

    <p>I am 15 years old and I come from Sri Lanka.</p>

    <h2>My Subjects This Year</h2>

    <ul>
      <li>English</li>
      <li>Maths</li>
      <li>Science</li>
      <li>Digital Technology</li>
      <li>Accounting</li>
      <li>Spanish</li>
    </ul>

    <img src="shrek.jpg" alt="Shrek image" width="250" height="250">

    <br>

    <a href="https://en.wikipedia.org/wiki/Clash_Royale" target="_blank">
      Clash Royale
    </a>
  </div>
</body>

</html>
